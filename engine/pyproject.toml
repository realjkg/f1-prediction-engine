[project]
name = "f1engine"
version = "0.1.0"
description = "F1 race prediction engine — pinned-data, evidence-first demonstrator (Adapt Cloud)"
requires-python = ">=3.12"
# Milestone 1 scaffold: only the API surface is wired. Each engine dependency
# is range-pinned; scikit-learn is additionally capped to one minor (1.7.x):
# its estimator internals (binning, tie-breaking) are only deterministic
# within a minor, and the determinism tests enforce the contract per version.
dependencies = [
    "fastapi>=0.115,<1",
    "prometheus-client>=0.21,<1",
    "pydantic>=2.9,<3",
    "pyarrow>=18,<25",
    "pyyaml>=6,<7",
    "scikit-learn>=1.7,<1.8",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f1engine"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
