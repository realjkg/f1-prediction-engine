[project]
name = "f1engine"
version = "0.1.0"
description = "F1 race prediction engine — pinned-data, evidence-first demonstrator (Adapt Cloud)"
requires-python = ">=3.12"
# Milestone 1 scaffold: only the API surface is wired. Scikit-learn lands with
# the models task, which pins the exact versions the determinism test enforces.
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pyarrow>=18,<25",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["f1engine"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
