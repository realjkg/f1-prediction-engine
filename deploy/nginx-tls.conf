# Production-only TLS 1.3 ingress; engine upstream uses mTLS.
# Certificate files are mounted at runtime, never copied into images.
server {
    # No per-request access log: it would record visitor IPs and user agents.
    access_log off;
    # Error lines include the client address; keep only critical server faults.
    error_log /dev/stderr crit;
    listen 8443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    ssl_certificate /run/tls/web.crt;
    ssl_certificate_key /run/tls/web.key;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;

    # API never traverses cleartext Docker HTTP in secure deployment.
    location /api/ {
        proxy_pass https://engine:8000;
        proxy_http_version 1.1;
        proxy_ssl_protocols TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /run/tls/ca.crt;
        proxy_ssl_server_name on;
        proxy_ssl_name engine;
        proxy_ssl_certificate /run/tls/web-client.crt;
        proxy_ssl_certificate_key /run/tls/web-client.key;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # Engine metrics are not exposed to public ingress.
    location = /metrics { return 404; }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
