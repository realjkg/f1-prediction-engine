# Production-capable isolated TLS 1.3 topology.
# Run: docker compose -f compose.tls.yaml up -d --build --wait engine web
# Do NOT combine this file with compose.yaml: that file is plaintext localhost dev.
# Provision CA, server and client certs externally; never commit private keys.

name: f1-pitwall-secure
services:
  engine:
    build:
      context: .
      dockerfile: deploy/Dockerfile.engine
    environment:
      F1E_DATA_DIR: data/snapshot
      F1E_LEDGER_PATH: data/evidence/ledger.jsonl
      F1E_DEMO_SEASON: "2024"
      F1E_BRIEF_MODE: fixture
      F1E_REQUIRE_TLS: "1"
      F1E_CORS_ORIGINS: "${F1E_CORS_ORIGINS:-capacitor://localhost,https://localhost}"
    volumes:
      - evidence:/app/data/evidence
      - "${F1E_TLS_CERTS_DIR:?TLS certificate directory required}:/run/tls:ro"
    read_only: true
    tmpfs:
      - /tmp:size=128m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; c=ssl.create_default_context(cafile='/run/tls/ca.crt'); c.minimum_version=ssl.TLSVersion.TLSv1_3; c.load_cert_chain('/run/tls/web-client.crt','/run/tls/web-client.key'); urllib.request.urlopen('https://engine:8000/api/config',context=c,timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    depends_on:
      engine:
        condition: service_healthy
    ports:
      - "${F1E_TLS_BIND_ADDRESS:-127.0.0.1}:${F1E_TLS_PORT:-8443}:8443"
    volumes:
      - ./deploy/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - "${F1E_TLS_CERTS_DIR:?TLS certificate directory required}:/run/tls:ro"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  evidence:
