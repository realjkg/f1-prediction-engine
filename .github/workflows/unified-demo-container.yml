name: Unified Demo Container

on:
  pull_request:
    paths:
      - "Dockerfile.vercel"
      - "engine/**"
      - "scripts/**"
      - "web/**"
      - "data/snapshot/**"
      - "docs/UNIFIED_DEMO_DEPLOYMENT.md"
      - ".github/workflows/unified-demo-container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-image:
    name: Single image UI/API/evidence smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the exact Vercel-compatible OCI image
        run: docker build -f Dockerfile.vercel -t f1-unified:${{ github.sha }} .
      - name: Launch container in read-only loopback test mode
        run: |
          docker run -d --name f1-unified --read-only --tmpfs /tmp \
            -e VERCEL=1 -p 127.0.0.1:18080:8080 \
            f1-unified:${{ github.sha }}
      - name: Test one-origin UI, API, evidence and inventory
        run: |
          python3 - <<'PY'
          import json
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen
          base = "http://127.0.0.1:18080"
          for _ in range(90):
              try:
                  with urlopen(base + "/healthz", timeout=3) as response:
                      if json.load(response)["status"] == "ok":
                          break
              except (URLError, TimeoutError, ValueError):
                  time.sleep(2)
          else:
              raise AssertionError("unified container did not become healthy")
          with urlopen(base + "/", timeout=10) as response:
              assert '<div id="root">' in response.read().decode()
              assert response.headers["X-Content-Type-Options"] == "nosniff"
              assert response.headers["X-Frame-Options"] == "DENY"
          with urlopen(base + "/api/config", timeout=10) as response:
              data = json.load(response)
              assert data["advisoryOnly"] is True
              assert data["briefMode"] == "fixture"
          with urlopen(base + "/api/races", timeout=10) as response:
              assert json.load(response)["total"] > 0
          with urlopen(base + "/api/evidence", timeout=10) as response:
              data = json.load(response)
              assert data["chainValid"] and data["total"] > 0
          with urlopen(base + "/api/supply-chain", timeout=10) as response:
              data = json.load(response)
              assert data["releaseReady"] is False
              assert data["totalComponents"] > 0
          for endpoint in ("/metrics", "/docs", "/openapi.json"):
              try:
                  urlopen(base + endpoint, timeout=10)
              except HTTPError as error:
                  assert error.code == 404, (endpoint, error.code)
              else:
                  raise AssertionError(f"public endpoint leaked: {endpoint}")
          print("Unified OCI demo: UI, API, evidence, inventory and privacy gates passed")
          PY
      - name: Refuse plaintext standalone exposure
        run: |
          if docker run --rm --entrypoint python \
              f1-unified:${{ github.sha }} \
              scripts/serve-unified-demo.py 2>/tmp/rejection.log; then
            echo "Standalone plaintext unexpectedly accepted"; exit 1
          fi
          grep -q "TLS 1.3 required" /tmp/rejection.log
      - name: Logs on failure
        if: failure()
        run: docker logs f1-unified --tail 150
      - name: Clean up
        if: always()
        run: docker rm -f f1-unified || true
