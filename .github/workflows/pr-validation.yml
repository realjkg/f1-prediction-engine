name: PR Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine — pytest + ruff
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Check U.S. English in authored documentation
        run: python3 scripts/check-us-english.py
      - name: Verify F1 completion alert fail-closed gates
        run: python3 -m unittest discover -s scripts/tests -p test_f1_completion_watch.py -v
      - name: Install engine from lock (hash-verified)
        # Locks are the source of truth (pip-compile --generate-hashes); CI never
        # re-resolves ranges, so builds are reproducible and pip-audit results are
        # authoritative for the exact installed set.
        run: |
          python3 -m pip install --require-hashes -r engine/requirements-dev.lock.txt
          python3 -m pip install --require-hashes -r engine/requirements.lock.txt
      - name: Test (pytest)
        run: python3 -m pytest engine/tests -q
      - name: Lint (ruff)
        run: python3 -m ruff check engine

  web:
    name: Web — vitest + tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        run: npm ci
      - name: Test (vitest)
        run: npm test
      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Capacitor smoke (build + cap sync)
        run: |
          npm run build
          npx cap sync

  dependency-audit:
    name: Dependency audit — pip-audit + npm audit
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install pip-audit (version-pinned)
        run: python3 -m pip install -q pip-audit==2.10.1
      - name: pip-audit engine runtime lock
        run: python3 -m pip_audit -r engine/requirements.lock.txt --strict
      - name: pip-audit engine dev lock
        run: python3 -m pip_audit -r engine/requirements-dev.lock.txt --strict
      - name: npm audit web production chain (blocking)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit web dev chain (warn only)
        working-directory: web
        run: npm audit --audit-level=critical || echo "::warning::dev-chain npm advisory — fix it or add an allowlist entry with a recorded reason"

  sbom:
    name: CycloneDX lockfile inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Generate deterministic source-lock CycloneDX inventory
        run: |
          python3 scripts/generate-sbom.py --output artifacts/f1-sbom.cdx.json
          python3 scripts/generate-sbom.py --output /tmp/f1-sbom-verify.cdx.json
          cmp artifacts/f1-sbom.cdx.json /tmp/f1-sbom-verify.cdx.json
          cmp artifacts/f1-sbom.cdx.manifest.json /tmp/f1-sbom-verify.cdx.manifest.json
      - name: Upload lockfile inventory and integrity manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f1-cyclonedx-lockfile-inventory
          path: |
            artifacts/f1-sbom.cdx.json
            artifacts/f1-sbom.cdx.manifest.json
          retention-days: 90
          if-no-files-found: error
